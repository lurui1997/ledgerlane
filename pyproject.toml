[project]
name = "ledgerlane"
version = "0.1.0"
description = "Agentic commerce MCP gateway: saga checkout, compensation, and a Postgres audit log for Alexa+."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Ledgerlane contributors" }]
dependencies = [
  "mcp>=1.20,<2",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "asyncpg>=0.30",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[project.scripts]
ledgerlane = "acmg.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
acmg = ["schema.sql", "static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
